name: Convert images to WebP

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '_vehicules/**'

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check for non-webp images
        id: check
        run: |
          COUNT=$(find images/ -maxdepth 1 \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \) | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT non-webp image(s)"

      - name: Convert images to WebP
        if: steps.check.outputs.count > 0
        run: npm run webp

      - name: Commit and push converted images
        if: steps.check.outputs.count > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ _vehicules/
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "auto: convert images to webp [skip ci]" && git push
