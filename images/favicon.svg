<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e02020"/>
      <stop offset="100%" style="stop-color:#9b0000"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="10" ry="10" fill="url(#bg)"/>
  <!-- Red accent bar at bottom -->
  <rect x="8" y="54" width="48" height="3" rx="1.5" fill="url(#red)"/>
  <!-- Letter B white -->
  <text x="10" y="47" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900" fill="#ffffff">B</text>
  <!-- Small red dot accent -->
  <circle cx="50" cy="18" r="5" fill="url(#red)"/>
</svg>
